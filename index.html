<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Baro OS — All-in-one POS, kitchen display, inventory control, and fake receipt verification system built for Ethiopian restaurants." />
  <meta name="keywords" content="Baro OS, Ethiopian restaurant POS, restaurant management Ethiopia, KDS, Telebirr receipt verification, Addis Ababa POS" />
  <title>Baro OS — Smart Restaurant Management System</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  <!-- DNS prefetch for external resources -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Primary font — loaded with swap for instant text render -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Secondary decorative fonts — loaded async so they don't block render -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,700&family=Satisfy&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <!-- Inline critical CSS for instant first paint (black bg + centered logo) -->
  <style>
    body { margin: 0; background: #000; color: #FAFAFA; font-family: Inter, sans-serif; transition: background-color 0.3s ease; }
    body[data-theme="fresh"] { background: #FFF; color: #020617; }
    .init-container { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; z-index: 9999; }
    body[data-theme="fresh"] .init-container { background: #FFF; }
    .init-content { display: flex; flex-direction: column; align-items: center; gap: 48px; }
    .init-logo { width: 120px; height: auto; opacity: 0.8; animation: pulse 2s ease-in-out infinite; }
    .init-status { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .init-label { font-size: 10px; font-weight: 900; color: rgba(255,255,255,0.2); letter-spacing: 0.8em; text-transform: uppercase; margin-left: 0.8em; }
    body[data-theme="fresh"] .init-label { color: rgba(0,0,0,0.2); }
    .init-sub { display: flex; align-items: center; gap: 12px; }
    .init-dot { width: 6px; height: 6px; background: #FFB800; border-radius: 50%; box-shadow: 0 0 10px #FFB800; animation: pulse 1s ease-in-out infinite; }
    .init-text { font-size: 11px; font-weight: 900; color: rgba(255,255,255,0.6); letter-spacing: 0.4em; text-transform: uppercase; }
    body[data-theme="fresh"] .init-text { color: rgba(0,0,0,0.6); }
    @keyframes pulse { 0%, 100% { opacity: 0.4; transform: scale(0.98); } 50% { opacity: 0.8; transform: scale(1); } }
  </style>
  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '910367244669180');
    fbq('track', 'PageView');
  </script>
  <!-- End Meta Pixel Code -->
</head>

<body>
  <!-- Meta Pixel Noscript -->
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=910367244669180&ev=PageView&noscript=1"
  /></noscript>
  <!-- End Meta Pixel Noscript -->
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('baro-theme');
        if (theme === 'fresh') document.body.setAttribute('data-theme', 'fresh');
      } catch (e) {}
    })();
  </script>
  <div id="root">
    <!-- Static Initializer UI (replaced by React once loaded) -->
    <div class="init-container">
      <div class="init-content">
        <img src="/baro-logo-full.png" class="init-logo" alt="Baro OS" />
        <div class="init-status">
          <span class="init-label">System Protocol</span>
          <div class="init-sub">
            <div class="init-dot"></div>
            <span class="init-text">Initializing Baro OS</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
