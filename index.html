<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sosha OS - Restaurant System</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 stroke=%22%23FFB800%22 stroke-width=%225%22 fill=%22none%22/><text x=%2250%22 y=%2258%22 font-family=%22sans-serif%22 font-weight=%22bold%22 font-size=%2226%22 text-anchor=%22middle%22 fill=%22%23FFB800%22>S</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            primary: {
              DEFAULT: '#FFC800', // Sharper Gold
              hover: '#FDB600',
              foreground: '#000000',
              glow: 'var(--primary-glow)'
            },
            secondary: {
              DEFAULT: '#A3E635', // Vibrant Lime
              hover: '#84CC16',
              foreground: '#000000'
            },
            background: 'var(--background)',
            card: 'var(--card)',
            border: 'var(--border)',
            foreground: 'var(--foreground)',
            muted: 'var(--muted)',
          },
          backdropBlur: {
            xs: '2px',
          },
          animation: {
            'float-slow': 'float 20s ease-in-out infinite',
            'float-medium': 'float 15s ease-in-out infinite reverse',
            'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0) scale(1)' },
              '50%': { transform: 'translateY(-20px) scale(1.02)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      /* Default (Dark) - "Sosha Void" */
      --background: #020202;
      /* Deeper black */
      --card: #0A0A0A;
      --border: #222222;
      --foreground: #FAFAFA;
      --muted: #71717A;

      /* Sleek Glass Vars */
      --primary-glow: rgba(255, 200, 0, 0.15);
      --glass-bg: rgba(20, 20, 20, 0.4);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-highlight: rgba(255, 255, 255, 0.03);
      --input-bg: rgba(255, 255, 255, 0.03);
      --shadow-color: rgba(0, 0, 0, 0.8);

      --bubble-1: rgba(16, 185, 129, 0.05);
      --bubble-2: rgba(132, 204, 22, 0.05);
    }

    body[data-theme="fresh"] {
      /* Fresh (Light) - "Crystal Clear" - Reduced Exposure */
      --background: #F0F2F5;
      /* Slightly darker cool gray */
      --card: #FFFFFF;
      --border: #CBD5E1;
      /* Darker border for contrast */
      --foreground: #0F172A;
      --muted: #475569;
      /* Darker muted text */

      --primary-glow: rgba(255, 200, 0, 0.15);
      /* Reduced glow intensity */
      --glass-bg: rgba(255, 255, 255, 0.6);
      --glass-border: rgba(0, 0, 0, 0.1);
      /* Stronger glass border */
      --glass-highlight: rgba(255, 255, 255, 0.4);
      --input-bg: #E2E8F0;
      /* Darker input background */
      --shadow-color: rgba(15, 23, 42, 0.1);

      --bubble-1: rgba(52, 211, 153, 0.1);
      --bubble-2: rgba(163, 230, 53, 0.1);
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      transition: background-color 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.4s ease;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .leaf-bubbles {
      display: none;
      opacity: 0;
      transition: opacity 1s ease;
    }

    body[data-theme="fresh"] .leaf-bubbles {
      display: block;
      opacity: 1;
    }

    /* Custom Scrollbar - Sleek */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 10px;
    }

    body[data-theme="fresh"] ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
        "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
        "react/": "https://aistudiocdn.com/react@^19.2.1/",
        "react": "https://aistudiocdn.com/react@^19.2.1",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
        "react-dom": "https://aistudiocdn.com/react-dom@^19.2.1",
        "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.86.2",
        "jsqr": "https://esm.sh/jsqr@1.4.0",
        "@tanstack/react-query": "https://esm.sh/@tanstack/react-query@5.28.9?external=react,react-dom",
        "@tanstack/react-query-devtools": "https://esm.sh/@tanstack/react-query-devtools@5.28.9?external=react,react-dom,@tanstack/react-query",
        "framer-motion": "https://esm.sh/framer-motion@11.0.8?external=react,react-dom"
      }
    }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>

</body>

</html>
