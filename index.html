    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22>&lt;circle cx=%2250%22 cy=%2250%22 r=%2245%22 stroke=%22%23FFB800%22 stroke-width=%225%22 fill=%22none%22/>&lt;text x=%2250%22 y=%2258%22 font-family=%22sans-serif%22 font-weight=%22bold%22 font-size=%2226%22 text-anchor=%22middle%22 fill=%22%23FFB800%22>S&lt;/text>&lt;/svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Classic (Dark Mode) - Default */
        --background: #050505;
        --card: #09090b; /* Zinc 950 - Deep Solid Black */
        --border: #27272a;
        --foreground: #F3F4F6;
        --muted: #9CA3AF;
        --primary-glow: rgba(255, 184, 0, 0.25);
        
        /* Elements */
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
        --input-bg: rgba(0, 0, 0, 0.2);
        --shadow-color: rgba(0, 0, 0, 0.6);

        /* Bubble Colors (Dark) */
        --bubble-1: rgba(16, 185, 129, 0.1);
        --bubble-2: rgba(132, 204, 22, 0.1);
      }

      /* Fresh Leaf (Light Mode) */
      body[data-theme="fresh"] {
        --background: #f8fafc; /* Slate-50 / Soft White */
        --card: #ffffff;
        --border: #e2e8f0; /* Slate-200 */
        --foreground: #0f172a; /* Slate-900 */
        --muted: #64748b; /* Slate-500 */
        --primary-glow: rgba(34, 197, 94, 0.4); /* Fresh Green Glow */

        /* Elements */
        --glass-bg: rgba(255, 255, 255, 0.6);
        --glass-border: rgba(0, 0, 0, 0.05);
        --input-bg: #f1f5f9; /* Slate-100 */
        --shadow-color: rgba(148, 163, 184, 0.15); /* Soft Slate Shadow */

        /* Bubble Colors (Light) */
        --bubble-1: rgba(110, 231, 183, 0.3); /* Emerald-300 */
        --bubble-2: rgba(190, 242, 100, 0.3); /* Lime-300 */
      }
      
      body {
        background-color: var(--background);
        color: var(--foreground);
        transition: background-color 0.5s ease, color 0.5s ease;
      }

      /* Leaf Bubbles Visibility Logic */
      .leaf-bubbles {
        display: none;
        opacity: 0;
        transition: opacity 1s ease;
      }
      body[data-theme="fresh"] .leaf-bubbles {
        display: block;
        opacity: 1;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
        border-radius: 4px;
      }
      body[data-theme="fresh"] ::-webkit-scrollbar-thumb {
        background: #cbd5e1; /* Slate-300 */
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555; 
      }
      body[data-theme="fresh"] ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; /* Slate-400 */
      }
    </style>
