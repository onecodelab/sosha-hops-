<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sosha OS - Restaurant System</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 stroke=%22%23FFB800%22 stroke-width=%225%22 fill=%22none%22/><text x=%2250%22 y=%2258%22 font-family=%22sans-serif%22 font-weight=%22bold%22 font-size=%2226%22 text-anchor=%22middle%22 fill=%22%23FFB800%22>S</text></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#FFB800', // Sosha Yellow
                hover: '#EAB308',
                foreground: '#000000'
              },
              secondary: {
                DEFAULT: '#84CC16', // Fresh Green
                hover: '#65A30D'
              },
              background: 'var(--background)',
              card: 'var(--card)',
              border: 'var(--border)',
              foreground: 'var(--foreground)',
              muted: 'var(--muted)',
            },
            animation: {
              'float-slow': 'float 20s ease-in-out infinite',
              'float-medium': 'float 15s ease-in-out infinite reverse',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0) scale(1)' },
                '50%': { transform: 'translateY(-20px) scale(1.05)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Default (Classic Dark/Gold) */
        --background: #050505;
        --card: #1A1A1A;
        --border: #27272a;
        --foreground: #F3F4F6;
        --muted: #9CA3AF;
        --primary-glow: rgba(255, 184, 0, 0.25); /* Gold Glow */
      }

      /* Fresh Leaf Theme Override */
      body[data-theme="fresh"] {
        --background: #020607; /* Deep Organic Black */
        --card: #050f0a;       /* Very Dark Green-Black */
        --border: #064e3b;     /* Emerald-900 */
        --foreground: #ecfdf5; /* Mint White */
        --muted: #6ee7b7;      /* Soft Green Muted */
        --primary-glow: rgba(74, 222, 128, 0.4); /* Green Glow */
      }
      
      body {
        background-color: var(--background);
        color: var(--foreground);
        transition: background-color 0.5s ease, color 0.5s ease;
      }

      /* Leaf Bubbles Visibility Logic */
      .leaf-bubbles {
        display: none;
        opacity: 0;
        transition: opacity 1s ease;
      }
      body[data-theme="fresh"] .leaf-bubbles {
        display: block;
        opacity: 1;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",

    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.86.2",
    "jsqr": "https://esm.sh/jsqr@1.4.0",
    "@tanstack/react-query": "https://esm.sh/@tanstack/react-query@5.28.9?external=react,react-dom",
    "@tanstack/react-query-devtools": "https://esm.sh/@tanstack/react-query-devtools@5.28.9?external=react,react-dom,@tanstack/react-query"
  }
}
</script>
</head>

    <div id="root"></div>
  </body>
</html>
