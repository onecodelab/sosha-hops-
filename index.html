<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sosha OS - Restaurant System</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 stroke=%22%23FFB800%22 stroke-width=%225%22 fill=%22none%22/><text x=%2250%22 y=%2258%22 font-family=%22sans-serif%22 font-weight=%22bold%22 font-size=%2226%22 text-anchor=%22middle%22 fill=%22%23FFB800%22>S</text></svg>"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              primary: {
                DEFAULT: "#FFB800", // Sosha Yellow
                hover: "#EAB308",
                foreground: "#000000",
              },
              secondary: {
                DEFAULT: "#84CC16", // Fresh Green
                hover: "#65A30D",
              },
              background: "var(--background)",
              card: "var(--card)",
              border: "var(--border)",
              foreground: "var(--foreground)",
              muted: "var(--muted)",
            },
          },
        },
      };
    </script>
    <style>
      :root {
        /* Clean Slate Theme (Light Mode) */
        --background: #f3f4f6;
        --card: #ffffff;
        --border: #e5e7eb;
        --foreground: #111827;
        --muted: #6b7280;
      }

      .dark {
        /* Deep Matte Black Theme */
        --background: #050505;
        --card: #1a1a1a;
        --border: #27272a;
        --foreground: #f3f4f6;
        --muted: #9ca3af;
      }

      body {
        background-color: var(--background);
        color: var(--foreground);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite React entry point -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
