<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="Baro OS - Sleek and powerful restaurant management system" />
  <title>Baro OS - Restaurant System</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  <!-- DNS prefetch for external resources -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Primary font — loaded with swap for instant text render -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Secondary decorative fonts — loaded async so they don't block render -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,700&family=Satisfy&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <!-- Inline critical CSS for instant first paint (black bg + centered spinner) -->
  <style>
    body { margin: 0; background: #020202; color: #FAFAFA; font-family: Inter, sans-serif; }
    #root:empty { display: flex; align-items: center; justify-content: center; min-height: 100dvh; }
    #root:empty::after { content: ''; width: 32px; height: 32px; border: 3px solid rgba(255,184,0,0.2); border-top-color: #FFB800; border-radius: 50%; animation: sp .6s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>

</body>

</html>
